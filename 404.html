<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Custom SVG Favicon (Fire/Flame) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 5 C50 5 15 45 15 65 A35 35 0 0 0 85 65 C85 45 50 5 50 5 Z' fill='%23D92D20'/%3E%3Ccircle cx='50' cy='60' r='12' fill='white'/%3E%3Cpath d='M50 48 V72 M38 60 H62' stroke='%231E3A8A' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Page Not Found · SEOUL BBQ</title>

    <script src="tailwind.js"></script>
    <style>
        /* ── SEOUL BBQ Palette ── */
        :root, html[data-theme='light'] {
            --color-dark-teal: #1E3A8A; /* Seoul Blue */
            --color-cream: #FDFBF7;     /* Warm off-white */
            --color-coral: #D92D20;     /* BBQ Ember */
            --color-white: #FFFFFF;
            --color-text-primary: #1C1917;
            --color-text-secondary: #78716C;
            --color-border: #E7E5E4;
            --color-hover: #F3EFE6;
        }
        html[data-theme='dark'] {
            --color-dark-teal: #3B82F6; /* Lighter Blue */
            --color-cream: #0C0A09;     /* Deep Charcoal */
            --color-coral: #EF4444;     /* Lighter Red */
            --color-white: #1C1917;
            --color-text-primary: #FAFAF9;
            --color-text-secondary: #A8A29E;
            --color-border: #292524;
            --color-hover: #1C1917;
        }

        body {
            background-color: var(--color-cream);
            color: var(--color-text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1, h2, h3, h4, h5, h6, .font-serif { 
            font-family: 'Playfair Display', serif;
            font-weight: 700 !important; 
            letter-spacing: -0.02em; 
        }
        p, .text-secondary { font-weight: 400 !important; }

        .bg-cream { background-color: var(--color-cream); }
        .bg-white { background-color: var(--color-white); }
        .bg-dark-teal { background-color: var(--color-dark-teal); }
        .bg-coral { background-color: var(--color-coral); }
        .text-dark-teal { color: var(--color-dark-teal); }
        .text-coral { color: var(--color-coral); }
        .text-primary { color: var(--color-text-primary); }
        .text-secondary { color: var(--color-text-secondary); }
        .border-border { border-color: var(--color-border); }
        .bg-hover { background-color: var(--color-hover); }

        /* ── Buttons ── */
        .btn-primary {
            background-color: var(--color-coral);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #B91C1C;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(217, 45, 32, 0.35);
        }
        .btn-outline {
            background: transparent;
            color: var(--color-dark-teal);
            border: 2px solid var(--color-dark-teal);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-outline:hover {
            background: var(--color-dark-teal);
            color: white;
            box-shadow: 0 6px 18px rgba(30, 58, 138, 0.25);
        }
        html[data-theme='dark'] .btn-outline {
            color: var(--color-dark-teal);
            border-color: var(--color-dark-teal);
        }
        html[data-theme='dark'] .btn-outline:hover {
            background: var(--color-dark-teal);
            color: #000;
        }

        /* ── 404 Specific Styles ── */
        .error-card {
            background-color: var(--color-white);
            border: 1px solid var(--color-border);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px rgba(12, 10, 9, 0.08);
            padding: 3rem 2rem;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
        .error-number {
            font-family: 'Playfair Display', serif;
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-coral) 0%, var(--color-dark-teal) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
        }
        .floating-icon {
            animation: floatIcon 6s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* ── Responsive Fixes ── */
        @media (max-width: 768px) {
            .error-number { font-size: 6rem; }
            .error-card { padding: 2rem 1.5rem; }
        }
        @media (max-width: 480px) {
            .btn-primary, .btn-outline { font-size: 1rem !important; padding: 0.75rem 1.25rem !important; }
            .error-number { font-size: 5rem; }
        }
    </style>
</head>
<body class="antialiased">

    <main class="flex-grow flex items-center justify-center py-20 px-6 relative overflow-hidden w-full">
        
        <!-- Decorative Background Icons -->
        <i class="fa-solid fa-fire absolute top-20 left-10 text-[150px] text-coral opacity-5 -rotate-12 floating-icon"></i>
        <i class="fa-solid fa-utensils absolute bottom-20 right-10 text-[180px] text-dark-teal opacity-5 rotate-45"></i>

        <div class="error-card text-center">
            
            <!-- Icon -->
            <div class="text-6xl text-coral mb-4 floating-icon">
                <i class="fa-solid fa-fire-burner"></i>
            </div>

            <!-- 404 Graphic -->
            <div class="error-number">404</div>

            <!-- Content -->
            <h1 class="text-3xl md:text-4xl font-bold text-dark-teal mb-4">Page Not Found</h1>
            <p class="text-secondary text-lg leading-relaxed mb-8">
                Looks like this page slipped off the grill. Don't worry, the fire is still burning and our kitchen is fully open. Let's get you back to the feast.
            </p>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center mb-8">
                <a href="index.html" class="btn-primary px-8 py-3.5 rounded-full font-bold text-lg shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-house"></i> Back to Home
                </a>
                <a href="reservations.html" class="btn-outline px-8 py-3.5 rounded-full font-bold text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calendar-check"></i> Book a Table
                </a>
            </div>

            <!-- Quick Links -->
            <div class="pt-6 border-t border-border">
                <p class="text-sm font-bold text-secondary uppercase tracking-wider mb-4">Looking for something specific?</p>
                <div class="flex flex-wrap justify-center gap-x-6 gap-y-3">
                    <a href="services.html" class="text-dark-teal font-semibold hover:text-coral transition-colors">Our Menu</a>
                    <a href="aboutus.html" class="text-dark-teal font-semibold hover:text-coral transition-colors">Our Story</a>
                    <a href="contact.html" class="text-dark-teal font-semibold hover:text-coral transition-colors">Contact</a>
                    <a href="guestdash.html" class="text-dark-teal font-semibold hover:text-coral transition-colors">Guest Portal</a>
                </div>
            </div>

        </div>
    </main>

    <!-- ══════════ THEME & RTL SCRIPT ══════════ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;

            // Theme Logic
            const themeToggles = [
                document.getElementById('theme-toggle')
            ];
            const applyTheme = (theme) => {
                html.setAttribute('data-theme', theme);
                document.querySelectorAll('.light-icon').forEach(i => i.classList.toggle('hidden', theme === 'dark'));
                document.querySelectorAll('.dark-icon').forEach(i => i.classList.toggle('hidden', theme === 'light'));
            };
            themeToggles.forEach(btn => btn?.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', next);
                applyTheme(next);
            }));
            applyTheme(localStorage.getItem('theme') || 'light');

            // RTL Logic
            const rtlToggles = [
                document.getElementById('rtl-toggle')
            ];
            const applyRTL = (dir) => {
                html.setAttribute('dir', dir);
            };
            rtlToggles.forEach(btn => btn?.addEventListener('click', () => {
                const currentDir = html.getAttribute('dir');
                const nextDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
                localStorage.setItem('dir', nextDir);
                applyRTL(nextDir);
            }));
            applyRTL(localStorage.getItem('dir') || 'ltr');
        });
    </script>
</body>
</html>
